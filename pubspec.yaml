name: jaidem
description: A new Flutter project with jaidem.
publish_to: 'none'

version: 1.4.7+61

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Theme
  google_fonts: ^6.1.0
  
  # Navigation
  auto_route: ^10.1.0+1
  
  # Network
  dio: ^5.9.0
  
  # Connectivity
  # connectivity_plus: ^7.0.0
  
  # Dependency Injection
  get_it: ^8.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  jwt_decoder: ^2.0.1
  dartz: ^0.10.1
  internet_connection_checker: ^1.0.0+1
  url_launcher: ^6.3.2
  share_plus: ^10.1.4
  image_picker: ^1.0.7
  flutter_launcher_icons: ^0.14.4
  dotted_border: ^3.1.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  intl: ^0.20.2

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5

  # PDF Viewer
  syncfusion_flutter_pdfviewer: ^28.2.7

  # HTML Parser
  flutter_html: ^3.0.0-beta.2
  flutter_staggered_grid_view: ^0.7.0
  rxdart: ^0.28.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  # Code Generation
  auto_route_generator: ^10.2.3
  build_runner: ^2.4.14


flutter_launcher_icons:
  android: "launcher_icon"
  remove_alpha_ios: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3F3D9E"
  adaptive_icon_foreground: "assets/images/app_logo.png"


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
